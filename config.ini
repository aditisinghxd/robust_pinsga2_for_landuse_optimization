[MODEL]
# Size of the land-use map grid - Options: 10x10 / 20x20 / 30x30 / 40x40 / 100x100
map_size = 10x10

# Maximum number of land-use categories (e.g., cropland types, forest, urban)
max_range = 8

# Controls how patches are identified in the landscape
four_neighbours = True


[ALGORITHM]
# Population size for the evolutionary algorithm
pop_size = 40

# Maximum number of generations for the optimization run
max_gen = 199

# Random seed for reproducibility of results
seeds = None


[DM]
# Frequency (in generations) at which Decision Maker (DM) interaction happens
dm_period = 50

# Number of candidate solutions shown to the DM for comparison
points = 10

# Type of DM: 'manual' or 'automated'
type_of_dm = automated

# Trade-off parameter controlling preference strength or weighting in DM logic
lambda = 1

# Metric the Automated DM uses to judge robustness across scenarios.
# Each option reflects a different attitude towards risk:
#
#   median      -> RISK NEUTRAL
#                  Judges a land-use option by its typical outcome
#                  (50th percentile of S and Yield over all scenarios).
#                  Good and bad scenarios count equally.
#
#   regret      -> RISK AVERSE (strict)
#                  Judges an option by its largest regret, i.e. how far its
#                  worst scenario falls below its best one. Prefers options
#                  that are stable and never perform very badly.
#
#   p90_regret  -> RISK AVERSE (moderate)
#                  Like regret, but uses the 90th percentile of regret, so a
#                  few extreme scenarios do not dominate the decision.
#
#   p90         -> RISK FRIENDLY (risk seeking)
#                  Judges an option by its good scenarios
#                  (90th percentile of S and Yield). Prefers options with a
#                  high upside, even if they are less stable.
#
# Allowed values: median | regret | p90_regret | p90
ADM_metric = median

[REFERENCE_POINT]
# Target preference values used by automated DM
# x → Crop Yield (to maximize)
# y → Forest Species Richness (to maximize)
x = 90
y = 10


[UNCERTAINTIES]
# Uncertain parameters used in robustness analysis (EMA Workbench)
# Format: parameter_name = lower_bound, upper_bound

# Species-area relationship constant (controls baseline biodiversity level)
c = 3.0, 7.0

# Species-area exponent (controls sensitivity of biodiversity to area changes)
z = 0.1, 0.3

# Fertility multiplier uncertainty (affects crop yield variability)
# Applied as: yield ~ log(lu * (1 + fet * fertility))
fet = 0, 1


[ROBUSTNESS]
# Number of uncertainty scenarios used in EMA robustness analysis
n_scenarios = 250